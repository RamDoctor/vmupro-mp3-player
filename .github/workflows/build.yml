name: Build VMUPro MP3 Player

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4

    steps:
      - name: Checkout repository with SDK submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch minimp3.h and move scratch buffer off stack
        shell: bash
        run: |
          mkdir -p main
          curl -fsSL --create-dirs https://raw.githubusercontent.com/lieff/minimp3/master/minimp3.h -o main/minimp3.h
          sed -i 's/mp3dec_scratch_t scratch;/static mp3dec_scratch_t scratch;/g' main/minimp3.h

      - name: Convert icon.png to 76x76 icon.bmp (if present)
        shell: bash
        run: |
          python3 -m venv /tmp/iconv
          /tmp/iconv/bin/pip install -q pillow
          /tmp/iconv/bin/python - << 'PYEOF'
          import os
          from PIL import Image
          for p in ("icon.png", "icon.PNG", "assets/icon.png"):
              if os.path.exists(p):
                  im = Image.open(p).convert("RGBA")
                  im.thumbnail((76, 76), Image.Resampling.LANCZOS)
                  cv = Image.new("RGBA", (76, 76), (0, 0, 0, 255))
                  cv.alpha_composite(im, ((76 - im.width) // 2, (76 - im.height) // 2))
                  cv.convert("RGB").save("icon.bmp", format="BMP")
                  print(f"Converted {p} -> icon.bmp")
                  break
          PYEOF

      - name: Build MP3Player.vmupack
        shell: bash
        run: |
          source /opt/esp/idf/export.sh
          mkdir -p out
          rm -f sdkconfig
          idf.py set-target esp32s3
          idf.py build
          echo "=== LIBMAIN SYMBOLS ==="
          xtensa-esp32s3-elf-nm -u build/esp-idf/main/libmain.a || true
          chmod +x pack.sh
          ./pack.sh
          cp mp3_player.vmupack out/MP3Player.vmupack

      - name: Upload MP3Player .vmupack
        uses: actions/upload-artifact@v4
        with:
          name: mp3-player-vmupack
          path: "out/MP3Player.vmupack"
